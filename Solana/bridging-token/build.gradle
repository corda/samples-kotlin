import static org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
import static org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9

buildscript { //properties that you need to build the project

    Properties constants = new Properties()
    file("$projectDir/../constants.properties").withInputStream { constants.load(it) }

    ext {
        corda_release_group = constants.getProperty("cordaReleaseGroup")
        corda_core_release_group =  constants.getProperty("cordaCoreReleaseGroup")
        corda_release_version = constants.getProperty("cordaVersion")
        corda_core_release_version = constants.getProperty("cordaCoreVersion")
        corda_gradle_plugins_version = constants.getProperty("gradlePluginsVersion")
        corda_tokens_release_group = constants.getProperty("cordaTokensGroup")
        corda_tokens_release_version = constants.getProperty("cordaTokensVersion")
        kotlin_version = constants.getProperty("kotlinVersion")
        corda_platform_version = constants.getProperty("platformVersion").toInteger()
        corda_shell_version = constants.getProperty("cordaShellVersion")
        corda_bridging_token_release_version = "0.1.0"
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://download.corda.net/maven/corda-releases' }
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "net.corda.plugins:cordapp:$corda_gradle_plugins_version"
        classpath "net.corda.plugins:cordformation:$corda_gradle_plugins_version"
        classpath "net.corda.plugins:quasar-utils:$corda_gradle_plugins_version"
    }
}

apply from: "${rootProject.projectDir}/repositories.gradle"

apply plugin: 'kotlin'
apply plugin: 'org.jetbrains.kotlin.jvm'

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    compilerOptions {
        languageVersion = KOTLIN_1_9
        apiVersion = KOTLIN_1_9
        jvmTarget = JVM_17
        javaParameters = true   // Useful for reflection.
        freeCompilerArgs = ['-Xjvm-default=all-compatibility']
        allWarningsAsErrors = true
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

apply plugin: 'net.corda.plugins.cordapp'
apply plugin: 'net.corda.plugins.cordformation'
apply plugin: 'net.corda.plugins.quasar-utils'

cordapp {
    targetPlatformVersion corda_platform_version
}

sourceSets {
    main {
        resources {
            srcDir rootProject.file("config/dev")
        }
    }
}

dependencies {
    cordaProvided "$corda_core_release_group:corda-core:$corda_core_release_version"
    cordaBootstrapper "$corda_release_group:corda-node-api:$corda_release_version"
    corda "$corda_release_group:corda:$corda_release_version"
    cordaDriver "$corda_core_release_group:corda-shell:$corda_shell_version"

    //corda "$corda_core_release_group:corda-node:$corda_core_release_version"
    //cordaBootstrapper ("$corda_core_release_group:corda-node-api:$corda_core_release_version")
    //cordaDriver "$corda_core_release_group:corda-shell:$corda_shell_version"

    cordapp "$corda_tokens_release_group:tokens-contracts:$corda_tokens_release_version"
    cordapp "$corda_tokens_release_group:tokens-workflows:$corda_tokens_release_version"

    cordapp "com.r3.corda.lib.solana:corda-bridging-token-contracts:$corda_bridging_token_release_version"
    cordapp "com.r3.corda.lib.solana:corda-bridging-token-workflows:$corda_bridging_token_release_version"

    cordapp "com.stockpaydividend:contracts:1.0"
    cordapp "com.stockpaydividend:workflows:1.0"
}

task deployNodes(type: net.corda.plugins.Cordform, dependsOn: ['jar']) {

    nodeDefaults {
        projectCordapp {
            deploy = false
        }
        cordapp("$corda_tokens_release_group:tokens-contracts:$corda_tokens_release_version")
        cordapp("$corda_tokens_release_group:tokens-workflows:$corda_tokens_release_version")

        cordapp("com.stockpaydividend:contracts:1.0")
        cordapp("com.stockpaydividend:workflows:1.0")

        runSchemaMigration = true
    }
    node {
        name "O=Notary,L=London,C=GB"
        notary = [validating : false, "serviceLegalName": "O=Notary Service,L=London,C=GB"]
        p2pPort 10002
        rpcSettings {
            address("localhost:10003")
            adminAddress("localhost:10033")
        }
    }
    node {
        name "O=Solana Notary,L=Ashburn,ST=Virginia,C=US"
        notary = [validating : false, "serviceLegalName" : "O=Solana Notary Service,L=Washington,C=US"]
        // TODO add Solana settings
        p2pPort 10002
        rpcSettings {
            address("localhost:10003")
            adminAddress("localhost:10033")
        }
    }
    node {
        name "O=WayneCo,L=SF,C=US"
        p2pPort 10005
        rpcSettings {
            address("localhost:10006")
            adminAddress("localhost:10036")
        }
        rpcUsers = [[ user: "user1", "password": "test", "permissions": ["ALL"]]]
        cordapp("$corda_tokens_release_group:tokens-workflows:$corda_tokens_release_version") {
            // Config to set a default notary to prevent the stock issuance flow to choose the second notary (Solana Notary)
            config """notary = "O=Notary Service,L=London,C=GB" """
        }
    }
    node {
        name "O=Shareholder,L=New York,C=US"
        p2pPort 10008
        rpcSettings {
            address("localhost:10009")
            adminAddress("localhost:10039")
        }
        rpcUsers = [[ user: "user1", "password": "test", "permissions": ["ALL"]]]
    }
    node {
        name "O=Bank,L=Washington DC,C=US"
        p2pPort 10012
        rpcSettings {
            address("localhost:10013")
            adminAddress("localhost:10043")
        }
        rpcUsers = [[ user: "user1", "password": "test", "permissions": ["ALL"]]]
    }
    node {
        name "O=Observer,L=Washington DC,C=US"
        p2pPort 10015
        rpcSettings {
            address("localhost:10016")
            adminAddress("localhost:10046")
        }
        rpcUsers = [[ user: "user1", "password": "test", "permissions": ["ALL"]]]
    }
    node {
        name "O=Bridging Authority,L=New York,C=US"
        p2pPort 10017
        rpcSettings {
            address("localhost:10018")
            adminAddress("localhost:10047")
        }
        rpcUsers = [[ user: "user1", "password": "test", "permissions": ["ALL"]]]
        cordapp("com.r3.corda.lib.solana:corda-bridging-token-contracts:$corda_bridging_token_release_version")
        cordapp("com.r3.corda.lib.solana:corda-bridging-token-workflows:$corda_bridging_token_release_version")
    }
}

tasks.register('installQuasar', Copy) {
    destinationDir rootProject.file("lib")
    from(configurations.quasar) {
        rename 'quasar-core(.*).jar', 'quasar.jar'
    }
}
