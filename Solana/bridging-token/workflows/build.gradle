apply plugin: 'net.corda.plugins.cordapp'
apply plugin: 'net.corda.plugins.quasar-utils'

cordapp {
    targetPlatformVersion corda_platform_version.toInteger()
    minimumPlatformVersion corda_platform_version.toInteger()
    workflow {
        name "Corda-Solana Token Bridge Flows"
        vendor "Corda Open Source"
        licence "Apache License, Version 2.0"
        versionId 1
    }
}

sourceSets {
    main {
        resources {
            srcDir rootProject.file("config/dev")
        }
    }
    test {
        resources {
            srcDir rootProject.file("config/test")
        }
    }
    integrationTest {
        kotlin {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
            srcDir file('src/integrationTest/kotlin')
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOny
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "$corda_enterprise_release_group:corda-solana-sdk:$corda_enterprise_release_version"

    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation 'net.corda.solana.notary:common:0.1.2'
    testImplementation "$corda_enterprise_release_group:corda-test-utils:$corda_enterprise_release_version"
    testImplementation 'com.lmax:solana4j:1.2.2'
    testImplementation 'com.lmax:solana4j-json-rpc:1.2.2'
    testImplementation "$corda_enterprise_release_group:corda-test-common:$corda_enterprise_release_version"

    testImplementation("org.junit.jupiter:junit-jupiter:5.14.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.14.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.14.0")

    testImplementation("$corda_enterprise_release_group:corda-node:$corda_enterprise_release_version")
    testImplementation("$corda_enterprise_release_group:corda-node-api:$corda_enterprise_release_version")
    testImplementation "$corda_enterprise_release_group:corda-node-driver:$corda_enterprise_release_version"
    testImplementation "$corda_enterprise_release_group:corda-core-test-utils:$corda_enterprise_release_version"

    // Corda dependencies.
    cordaProvided "$corda_os_release_group:corda-core:$corda_os_release_version"
    cordaProvided "$corda_enterprise_release_group:corda:$corda_enterprise_release_version"

    // Corda dependencies needed for SolanaClient.
    cordaProvided "$corda_enterprise_release_group:corda-node:$corda_enterprise_release_version"
    cordaProvided "software.sava:sava-rpc:$sava_version"

    cordaProvided "$corda_enterprise_release_group:corda-solana-sdk:$corda_enterprise_release_version"

    cordaProvided "com.r3.corda.lib.tokens:tokens-contracts:$corda_tokens_release_version"
    cordaProvided "com.r3.corda.lib.tokens:tokens-workflows:$corda_tokens_release_version"

    cordapp("com.r3.corda.lib.solana:corda-bridging-token-workflows:0.1.1-SNAPSHOT")
    cordapp("com.r3.corda.lib.solana:corda-bridging-token-contracts:0.1.1-SNAPSHOT")

    cordapp("com.stockpaydividend:contracts:1.0")
    cordapp("com.stockpaydividend:workflows:1.0")

    //TODO these will be removed after TokenAccountService is placed in a common dependency in toolkit
    cordaProvided "com.lmax:solana4j:1.2.2"
    cordaProvided "com.lmax:solana4j-json-rpc:1.2.2"
    cordaProvided "com.github.ben-manes.caffeine:caffeine:3.2.3"
    //cordaProvided "net.corda.solana.notary:common:$corda_solana_notary_version"
}

tasks.withType(Test).configureEach { t ->
    systemProperty 'co.paralleluniverse.fibers.verifyInstrumentation', 'false'
    systemProperty 'co.paralleluniverse.fibers.detectRunawayFibers', 'false'

    // Remove existing quasar -javaagent if something (e.g. corda/quasar-utils) already adds it
    def currentArgs = (t.jvmArgs ?: [])
    t.jvmArgs = currentArgs.findAll { !(it.toString().contains('quasar') && it.toString().contains('-javaagent:')) }

    // Add Quasar agent with allowMonitors (=m) to fix kotlin/SynchronizedLazyImpl issues
    def quasarJar = configurations.quasar.singleFile
    t.jvmArgs "-javaagent:${quasarJar}=m"
}

task integrationTest(type: Test, dependsOn: []) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
}

check.dependsOn integrationTest

test {
    useJUnitPlatform()
}