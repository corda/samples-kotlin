apply plugin: 'net.corda.plugins.cordapp'

cordapp {
    targetPlatformVersion corda_platform_version.toInteger()
    minimumPlatformVersion corda_platform_version.toInteger()
    contract {
        name "Corda-Solana DvP Contracts"
        vendor "Corda Open Source"
        licence "Apache License, Version 2.0"
        versionId 1
    }
    signing {
        enabled true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    testImplementation "junit:junit:$junit_version"

    // Corda dependencies.
    cordaProvided "$corda_core_release_group:corda-core:$corda_core_release_version"
    cordaProvided "$corda_release_group:corda-solana-sdk:$corda_release_version"

    testImplementation "$corda_release_group:corda-node-driver:$corda_release_version"
    testImplementation "$corda_release_group:corda-test-utils:$corda_release_version" // Enterprise dependency for notary instruction code
    testImplementation "$corda_core_release_group:corda-core-test-utils:$corda_core_release_version"

    // Token SDK dependencies.
    cordaProvided "$corda_tokens_release_group:tokens-contracts:$corda_tokens_release_version"
}

test {
    jvmArgs = rootProject.ext.testJvmArgs
}